<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleo – World of Entheon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game">
        <div class="game-window">

            <header class="game-header">
                <div>
                    <h1>Kaleo</h1>
                    <p>World of Entheon</p>
                </div>
                <div id="status-bar">
                    <span id="area-status">Kaleo</span>
                    <span> · </span>
                    <span id="starter-status">Starter: —</span>
                </div>
            </header>

            <main class="game-screen">

                <div id="intro-screen">
                    <div class="dialogue">
                        <h2 id="scene-title"></h2>
                        <div id="scene-text"></div>
                    </div>
                    <div id="options" class="options"></div>
                </div>

                <div id="overworld-screen" class="hidden">
                    <div id="game-container">
                        <canvas id="game-canvas" width="768" height="576"></canvas>
                    </div>

                    <div id="controls-help">
                        <span><strong>Move:</strong> WASD / Arrow Keys</span>
                        <span><strong>Interact:</strong> E / Enter / Space</span>
                    </div>

                    <div id="world-message" class="world-message hidden"></div>

                    <div id="npc-dialogue" class="npc-dialogue hidden">
                        <div id="npc-dialogue-name"></div>
                        <div id="npc-dialogue-text"></div>
                        <div class="npc-dialogue-hint">Press E, Enter or Space to continue</div>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <div id="battle-screen" class="hidden">
        <div class="battle-panel">

            <div class="battle-status-card wild-card">
                <div class="battle-name-row">
                    <strong id="battle-wild-name">Wild Orrin</strong>
                    <span id="battle-wild-level">Lv. 3</span>
                </div>
                <div class="hp-label">HP <span id="battle-wild-hp">30 / 30</span></div>
                <div class="hp-bar"><div class="hp-fill" id="battle-hp-fill"></div></div>
            </div>

            <div class="battle-arena">
                <div class="battle-creature-art wild-art" id="battle-wild-art">
                    <div class="creature-shadow"></div>
                    <div class="creature-body">
                        <div class="creature-ear left"></div>
                        <div class="creature-ear right"></div>
                        <div class="creature-eye left"></div>
                        <div class="creature-eye right"></div>
                        <div class="creature-tail"></div>
                    </div>
                </div>
            </div>

            <div class="battle-player-row">
                <div class="battle-creature-art player-art" id="battle-player-art">
                    <div class="creature-shadow"></div>
                    <div class="creature-body">
                        <div class="creature-ear left"></div>
                        <div class="creature-ear right"></div>
                        <div class="creature-eye left"></div>
                        <div class="creature-eye right"></div>
                        <div class="creature-tail"></div>
                    </div>
                </div>

                <div class="battle-status-card player-card">
                    <div class="battle-name-row">
                        <strong id="battle-player-name">Morrowe</strong>
                        <span id="battle-player-level">Lv. 5</span>
                    </div>
                    <div class="hp-label">HP <span id="battle-player-hp">40 / 40</span></div>
                    <div class="hp-bar"><div class="hp-fill" id="battle-player-hp-fill"></div></div>
                </div>
            </div>

            <div class="battle-message" id="battle-message">A wild Orrin appeared!</div>

            <div class="battle-controls">
                <div class="battle-command-panel">
                    <div class="battle-command-title">What will Morrowe do?</div>
                    <div class="battle-moves" id="battle-moves"></div>
                </div>

                <div class="battle-main-actions">
                    <button id="battle-fight" class="option-button">Fight</button>
                    <button id="battle-run" class="option-button">Run</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js?v=8"></script>
</body>
</html>
