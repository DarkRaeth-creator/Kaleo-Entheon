<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleo – World of Entheon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game">
        <div class="game-window">
            <header class="game-header">
                <div>
                    <h1>Kaleo</h1>
                    <p>World of Entheon</p>
                </div>
                <div id="status-bar">
                    <span id="area-status">Kaleo</span>
                    <span> · </span>
                    <span id="starter-status">Starter: —</span>
                </div>
            </header>

            <main class="game-screen">
                <div id="intro-screen">
                    <div class="dialogue">
                        <h2 id="scene-title"></h2>
                        <div id="scene-text"></div>
                    </div>
                    <div id="options" class="options"></div>
                </div>

                <div id="overworld-screen" class="hidden">
                    <div id="game-container">
                        <canvas id="game-canvas" width="768" height="576"></canvas>
                    </div>

                    <div id="controls-help">
                        <span><strong>Move:</strong> WASD / Arrow Keys</span>
                        <span><strong>Interact:</strong> E / Enter / Space</span>
                    </div>

                    <div id="world-message" class="world-message hidden"></div>

                    <div id="npc-dialogue" class="npc-dialogue hidden">
                        <div id="npc-dialogue-name"></div>
                        <div id="npc-dialogue-text"></div>
                        <div class="npc-dialogue-hint">Press E, Enter or Space to continue</div>
                    </div>
                </div>

                <div id="battle-screen" class="battle-screen hidden">
                    <div class="battle-field">
                        <div class="battle-opponent">
                            <div class="battle-creature-card">
                                <div class="battle-creature-title">
                                    <strong id="battle-wild-name">Wild Entheon</strong>
                                    <span id="battle-wild-level">Lv. 3</span>
                                </div>
                                <div class="battle-hp-text"><span>HP</span> <span id="battle-wild-hp">30 / 30</span></div>
                                <div class="hp-bar"><div id="battle-hp-fill" class="hp-fill"></div></div>
                            </div>
                        </div>

                        <div class="battle-creature-placeholder">ENTHEON</div>

                        <div class="battle-player-card">
                            <div class="battle-creature-card">
                                <div class="battle-creature-title">
                                    <strong id="battle-player-name">Morrowe</strong>
                                    <span id="battle-player-level">Lv. 5</span>
                                </div>
                                <div class="battle-hp-text"><span>HP</span> <span id="battle-player-hp">40 / 40</span></div>
                                <div class="hp-bar"><div id="battle-player-hp-fill" class="hp-fill"></div></div>
                            </div>
                        </div>
                    </div>

                    <div id="battle-message" class="battle-message">A wild Entheon appeared!</div>

                    <div class="battle-actions">
                        <button id="battle-fight" class="battle-action-button" type="button">Fight</button>
                        <button id="battle-run" class="battle-action-button" type="button">Run</button>
                    </div>

                    <div id="battle-moves" class="battle-moves"></div>
                </div>
            </main>
        </div>
    </div>

    <script src="game.js?v=20260927-3"></script>
</body>
</html>
