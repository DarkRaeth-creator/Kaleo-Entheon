<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleo – World of Entheon</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        #character-creation-screen.hidden { display:none !important; }
        .kaleo-cc { width:100%; min-height:100%; box-sizing:border-box; padding:14px; color:#f3f4f6; background:#091522; }
        .kaleo-cc-header { display:flex; justify-content:space-between; align-items:center; border:1px solid #a8792e; background:#0d1c2b; padding:18px 22px; }
        .kaleo-cc-kicker { color:#e4b64d; font-size:11px; letter-spacing:1.5px; font-weight:700; margin-bottom:2px; }
        .kaleo-cc-header h1 { margin:0; font-family:Georgia,serif; font-size:31px; color:#f5f1e8; }
        .kaleo-cc-header p { margin:5px 0 0; color:#b9c3cf; font-size:13px; }
        .kaleo-cc-step { width:68px; height:68px; border:1px solid #a8792e; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#f4c75d; font-weight:700; font-size:20px; line-height:18px; }
        .kaleo-cc-step span { font-size:8px; letter-spacing:1px; margin-top:5px; }
        .kaleo-cc-body { display:grid; grid-template-columns:145px minmax(300px,1fr) minmax(360px,1.15fr); gap:9px; margin-top:9px; }
        .kaleo-cc-steps, .kaleo-cc-preview, .kaleo-cc-options { border:1px solid #33465a; background:#0c1825; min-height:380px; }
        .kaleo-cc-steps { padding:18px 10px; }
        .kaleo-cc-steps > div { display:flex; gap:10px; align-items:center; padding:14px 7px; color:#91a0b1; border-left:3px solid transparent; }
        .kaleo-cc-steps > div.active { color:#f2f4f7; border-left-color:#e8bc50; background:#142638; }
        .kaleo-cc-steps b { width:25px; height:25px; border-radius:50%; display:grid; place-items:center; background:#27394d; color:#fff; font-size:12px; }
        .kaleo-cc-steps .active b { background:#e9c45b; color:#16202a; }
        .kaleo-cc-steps span { font-size:12px; font-weight:700; }
        .kaleo-cc-steps small { display:block; color:#718194; font-size:9px; font-weight:400; margin-top:3px; }
        .kaleo-cc-panel-title { padding:9px 12px; border-bottom:1px solid #33465a; color:#dfe6ef; font-size:12px; font-weight:700; }
        .kaleo-cc-preview { display:flex; flex-direction:column; }
        .kaleo-cc-preview-stage { flex:1; min-height:290px; display:flex; justify-content:center; align-items:center; background:radial-gradient(circle,#12263a 0%,#08121d 70%); }
        .kaleo-cc-caption { padding:12px; border-top:1px solid #33465a; display:flex; justify-content:space-between; align-items:center; }
        .kaleo-cc-caption strong { color:#fff; font-size:13px; }
        .kaleo-cc-caption span { color:#708094; font-size:9px; }
        .kaleo-cc-options { padding:10px; }
        .kaleo-cc-gender-toggle { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-bottom:12px; }
        .kaleo-cc-gender-toggle button { border:1px solid #42566d; background:#101f2f; color:#d9e0e8; padding:11px; cursor:pointer; }
        .kaleo-cc-gender-toggle button.selected { border-color:#6daee8; box-shadow:inset 0 -2px 0 #6daee8; background:#132b42; color:#fff; }
        .kaleo-cc-current { border:1px solid #33465a; padding:18px; min-height:180px; background:#0a1521; }
        .kaleo-cc-section-title { color:#f0c45a; font-weight:700; font-size:14px; margin-bottom:8px; }
        .kaleo-cc-current p { color:#91a0b1; font-size:11px; line-height:1.5; }
        .kaleo-cc-choice-note { margin-top:25px; padding:14px; border:1px solid #2d4257; background:#0f2030; display:flex; flex-direction:column; gap:4px; }
        .kaleo-cc-choice-note strong { font-size:18px; color:#fff; }
        .kaleo-cc-choice-note span { font-size:10px; color:#8392a4; }
        .kaleo-cc-name { margin-top:12px; }
        .kaleo-cc-name label { display:block; color:#dbe2eb; font-size:10px; font-weight:700; text-transform:uppercase; margin-bottom:5px; }
        .kaleo-cc-name input { width:100%; box-sizing:border-box; border:1px solid #4b5e74; background:#10111c; color:#fff; padding:11px; font-size:14px; outline:none; }
        .kaleo-cc-name input:focus { border-color:#d3a943; }
        .kaleo-cc-footer { margin-top:9px; border:1px solid #33465a; background:#0d1c2b; padding:12px; display:flex; align-items:center; justify-content:space-between; }
        .kaleo-cc-footer span { color:#8090a2; font-size:10px; }
        .kaleo-cc-footer button { border:1px solid #e2bb55; background:#d9a93f; color:#1c1c1c; padding:10px 28px; font-weight:700; cursor:pointer; }
        .cc-large-sprite .cc-sprite-preview-canvas { image-rendering:pixelated; }
        .cc-sprite-preview-canvas { image-rendering:pixelated; }
        @media (max-width:900px) { .kaleo-cc-body { grid-template-columns:1fr; } .kaleo-cc-steps { min-height:0; } }
    </style>
</head>
<body>
    <div id="game">
        <div class="game-window">
            <header class="game-header">
                <div>
                    <h1>Kaleo</h1>
                    <p>World of Entheon</p>
                </div>
                <div id="status-bar">
                    <span id="starter-status">Starter: —</span>
                </div>
            </header>

            <main class="game-screen">
                <div id="intro-screen">
                    <div class="dialogue">
                        <h2 id="scene-title"></h2>
                        <div id="scene-text"></div>
                    </div>
                    <div id="options" class="options"></div>
                </div>

                <div id="character-creation-screen" class="hidden"></div>

                <div id="overworld-screen" class="hidden">
                    <div id="game-container">
                        <canvas id="game-canvas" width="768" height="576"></canvas>
                    </div>
                    <div id="controls-help">
                        <span><strong>Move:</strong> WASD / Arrow Keys</span>
                        <span><strong>Interact:</strong> E / Enter / Space</span>
                    </div>
                    <div id="world-message" class="world-message hidden"></div>
                    <div id="npc-dialogue" class="npc-dialogue hidden">
                        <div id="npc-dialogue-name"></div>
                        <div id="npc-dialogue-text"></div>
                        <div class="npc-dialogue-hint">Press E, Enter or Space to continue</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
