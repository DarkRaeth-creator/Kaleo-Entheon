<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleo – World of Entheon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game">
        <div class="game-window">

            <header class="game-header">
                <div>
                    <h1>Kaleo</h1>
                    <p>World of Entheon</p>
                </div>
                <div id="status-bar">
                    <span id="area-status">Kaleo</span>
                    <span> · </span>
                    <span id="starter-status">Starter: —</span>
                </div>
            </header>

            <main class="game-screen">

                <div id="intro-screen">
                    <div class="dialogue">
                        <h2 id="scene-title"></h2>
                        <div id="scene-text"></div>
                    </div>
                    <div id="options" class="options"></div>
                </div>

                <div id="overworld-screen" class="hidden">
                    <div id="game-container">
                        <canvas id="game-canvas" width="768" height="576"></canvas>
                    </div>

                    <div id="controls-help">
                        <span><strong>Move:</strong> WASD / Arrow Keys</span>
                        <span><strong>Interact:</strong> E / Enter / Space</span>
                    </div>

                    <div id="world-message" class="world-message hidden"></div>

                    <div id="npc-dialogue" class="npc-dialogue hidden">
                        <div id="npc-dialogue-name"></div>
                        <div id="npc-dialogue-text"></div>
                        <div class="npc-dialogue-hint">Press E, Enter or Space to continue</div>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
